# Before using this, export the following:
# export PUID=$(id -u)
# export GUID=$(id -g)
# export TZ=America/New_York
# export time=$(cat /etc/timezone)
# export plexclaim=
# Environment Variable Examples:
# PUID = 99
# GUID = 101
# TZ = America/New_York
# BASE_PATH = /Users/thor/media # This is where you docker containers will store their data for each application
# MEDIA_SHARE = /Users/thor/media  # This is where your media files will live
# export BASE_PATH=/Users/groot/media # This is where you docker containers will store their data for each application
# export MEDIA_SHARE=/Users/groot/media  # This is where your media files will live
#
# https://trash-guides.info/Hardlinks/Hardlinks-and-Instant-Moves/ # This can be useful for establishing how the media will be presented below

---      
services:
  #Plex - used to display the media
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    environment:
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - "${BASE_PATH}/plex/config:/config"
      - "${MEDIA_SHARE}/tv:/tv"
      - "${MEDIA_SHARE}/movies:/movies"
#      - /mnt/nfs01/media/plex/config:/config
#      - /mnt/nfs01/media/tv:/tv
#      - /mnt/nfs01/media/movies:/movies
    ports:
      - 32400:32400
    restart: unless-stopped

  sabnzbd:
    image: linuxserver/sabnzbd
    container_name: sabnzbd
    volumes:
      - "${BASE_PATH}/sabnzbd/datadir:/datadir"
      - "${MEDIA_SHARE}/movies:/datadir/movies"
      - "${MEDIA_SHARE}/tv:/datadir/tv"
      - "${MEDIA_SHARE}/music:/datadir/music"
      - "${MEDIA_SHARE}/software:/datadir/software"
    ports:
      - 8080:8080
    restart: unless-stopped

  #Radarr - used to find movies automatically
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
    volumes:
      - ${BASE_PATH}/radarr/config:/config
      - ${MEDIA_SHARE}:/data #Access to the entire share
    ports:
      - 7878:7878
    restart: unless-stopped

  #Sonarr - used to find tv shows automatically
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
    volumes:
      - ${BASE_PATH}/sonarr/config:/config
      - ${MEDIA_SHARE}:/data #Access to the entire share
    ports:
      - 8989:8989
    restart: unless-stopped
    
  #Prowlarr - manages your Sonarr, Radarr and download client
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
    volumes:
      - ${BASE_PATH}/prowlarr/config:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  #Seerr - allows users to request media on their own
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      - LOG_LEVEL=debug
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
      - PORT=5055 #optional
    volumes:
      - ${BASE_PATH}/seer/config:/app/config
      - ${MEDIA_SHARE}:/data #Access to the entire share
    ports:
      - 5055:5055
    restart: unless-stopped

  #Tautulli - for plex statistics. Very useful when troubleshooting performance issues
  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    environment:
      - PUID=${PUID}
      - PGID=${GUID}
      - TZ=${TZ}
    volumes:
      - ${BASE_PATH}/tautulli/config:/config
    ports:
      - 8181:8181
    restart: unless-stopped

  #Wizarr - Allows you to create a share link that you can send to users to invite them to your media server
  wizarr:
    image: ghcr.io/wizarrrr/wizarr:latest
    container_name: wizarr
    volumes:
      - ${BASE_PATH}/wizarr/data/database:/data/database
    ports:
      - 5690:5690
    restart: unless-stopped