# Select env file
# docker compose --env-file .env.laptop up -d
# Before using this, export the following:
# export plexclaim=
# get claim token from https://www.plex.tv/claim/
# static variables are in the .env file
# https://trash-guides.info/Hardlinks/Hardlinks-and-Instant-Moves/ # This can be useful for establishing how the media will be presented below

---      
services:
  #Plex - used to display the media
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - "${MEDIA_SHARE}/config/plex/config:/config"
      - "${MEDIA_SHARE}/media/tv:/tv"
      - "${MEDIA_SHARE}/media/movies:/movies"
    ports:
      - 32400:32400
    restart: unless-stopped

  #sabnzbd - download client
  sabnzbd:
    image: linuxserver/sabnzbd
    container_name: sabnzbd
    volumes:
      - "${MEDIA_SHARE}/config/sabnzbd/datadir:/datadir"
      - "${MEDIA_SHARE}/downloads/complete:/complete"
      - "${MEDIA_SHARE}/downloads/incomplete:/incomplete"
#      - "${MEDIA_SHARE}/sabnzbd/datadir/movies:/datadir/movies"
#      - "${MEDIA_SHARE}/sabnzbd/datadir/tv:/datadir/tv"
#      - "${MEDIA_SHARE}/sabnzbd/datadir/music:/datadir/music"
#      - "${MEDIA_SHARE}/sabnzbd/datadir/software:/datadir/software"
    ports:
      - 8080:8080
    restart: unless-stopped

  #Radarr - used to find movies automatically
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${MEDIA_SHARE}/config/radarr/config:/config
      - ${MEDIA_SHARE}:/media #Access to the entire share
    ports:
      - 7878:7878
    restart: unless-stopped

  #Sonarr - used to find tv shows automatically
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${MEDIA_SHARE}/config/sonarr/config:/config
      - ${MEDIA_SHARE}:/media #Access to the entire share
    ports:
      - 8989:8989
    restart: unless-stopped

  #Bazarr - used to find subtitles
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${MEDIA_SHARE}/config/bazarr/config:/config
      - ${MEDIA_SHARE}/media/movies:/movies #optional
      - ${MEDIA_SHARE}/media/tv:/tv #optional
    ports:
      - 6767:6767
    restart: unless-stopped
    
  #Prowlarr - manages your Sonarr, Radarr and download client
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${MEDIA_SHARE}/config/prowlarr/config:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  # #Seerr - allows users to request media on their own
  # seerr:
  #   image: ghcr.io/seerr-team/seerr:latest
  #   init: true
  #   container_name: seerr
  #   user: "1000:1000"
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - LOG_LEVEL=debug
  #     - TZ=${TZ}
  #     - PORT=5055 #optional
  #   volumes:
  #     - ${MEDIA_SHARE}/config/seerr/config:/app/config
  #     - ${MEDIA_SHARE}:/media #Access to the entire share
  #   ports:
  #     - 5055:5055
  #   healthcheck:
  #     test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
  #     start_period: 20s
  #     timeout: 3s
  #     interval: 15s
  #     retries: 3
  #   security_opt:
  #     - no-new-privileges
  #   cap_drop:
  #     - ALL
  #   restart: unless-stopped

  #Tautulli - for plex statistics. Very useful when troubleshooting performance issues
  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${MEDIA_SHARE}/config/tautulli/config:/config
    ports:
      - 8181:8181
    restart: unless-stopped

  #Wizarr - Allows you to create a share link that you can send to users to invite them to your media server
  wizarr:
    image: ghcr.io/wizarrrr/wizarr:latest
    container_name: wizarr
    volumes:
      - ${MEDIA_SHARE}/config/wizarr/data/database:/data/database
    ports:
      - 5690:5690
    restart: unless-stopped