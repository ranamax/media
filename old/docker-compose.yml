# Before using this, export the following:
# export userid=$(id -u)
# export groupid=$(id -g)
# export time=$(cat /etc/timezone)
# export plexclaim=

volumes:
  plex:
    driver: local
#    driver_opts:
#      type: nfs
#      o: addr=10.0.0.51,rw
#      device: ":/volume1/nfs01/docker/"
services:
  plex:
    container_name: plex
#    image: linuxserver/plex
    image: lscr.io/linuxserver/plex:latest
    restart: always
    ports:
      - 32400:32400/tcp
      - 3005:3005/tcp
      - 8324:8324/tcp
      - 32469:32469/tcp
      - 1900:1900/udp
      - 32410:32410/udp
      - 32412:32412/udp
      - 32413:32413/udp
      - 32414:32414/udp
    environment:
      - VERSION=latest
      - TZ=America/New_York
      - PLEX_CLAIM=${plexclaim}
#      - ADVERTISE_IP=http://192.168.42.99:32400/
    hostname: plex
    volumes:
      - "/Users/thor/media/plex/config:/config"
      - "/Users/thor/media/plex/transcode:/transcode"
      - "/Users/thor/media/tv:/tv"
      - "/Users/thor/media/movies:/movies"
#      - /mnt/nfs01/media/plex/config:/config
#      - /mnt/nfs01/media/plex/transcode:/transcode
#      - /mnt/nfs01/media/tv:/tv
#      - /mnt/nfs01/media/movies:/movies

  sabnzbd:
    image: linuxserver/sabnzbd
    container_name: sabnzbd
    restart: always
    ports:
      - 8080:8080
    volumes:
      - "/Users/thor/media/sabnzbd/datadir:/datadir"
      - "/Users/thor/media/movies:/datadir/movies"
      - "/Users/thor/media/tv:/datadir/tv"
      - "/Users/thor/media/music:/datadir/music"
      - "/Users/thor/media/software:/datadir/software"

  radarr:
    image: linuxserver/radarr
    container_name: radarr
    restart: always
    ports:
      - 7878:7878
    volumes:
      - "/Users/thor/media/radarr:/config"
      - "/Users/thor/media/movies:/movies"
      - "/Users/thor/media/downloads:/downloads"
#      - /etc/localtime:/etc/localtime:ro
    environment:
      PUID: ${userid}
      PGID: ${groupid}
#      TZ: ${time}
      TZ: America/Los_Angeles

    # ----------------------------------------
    # SICKRAGE
    # ----------------------------------------
  sickrage:
    image: sickrage/sickrage
#    image: linuxserver/sickchill
    container_name: sickrage
    restart: always
    network_mode: "bridge"
    ports:
      - '8081:8081'
    environment:
      - PUID=${userid}
      - PGID=${groupid}
    volumes:
      - '/Users/thor/media/sickrage/config:/config'
      - '/Users/thor/media/downloads:/downloads'
      - '/Users/thor/media/tv:/tv'
      - '/Users/thor/media/movies:/movies'
#      - '/etc/localtime:/etc/localtime:ro'


  organizr:
    image: lsiocommunity/organizr
    container_name: organizr
    restart: always
#    networks:
#      - media
    ports:
      - 8811:80
      - 8443:443
    volumes:
      - '/Users/thor/media/organizr/config:/config'
    environment:
      PUID: ${userid}
      PGID: ${groupid}
#      TZ: ${time}
      TZ: America/Los_Angeles
